name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check Code Formatting (Spotless & Sortpom)
      run: mvn spotless:check sortpom:verify

    - name: Build with Maven (including Tests)
      run: mvn -B verify

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: target/surefire-reports/
        retention-days: 5

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: target/site/jacoco/
        retention-days: 5
