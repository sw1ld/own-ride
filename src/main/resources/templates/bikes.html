{#include base}
    <h1 class="title">Bikes</h1>

    <div class="box">
        <h2 class="title is-4">Add New Bike</h2>
        <form action="/own/bikes" method="POST">
            <div class="field is-horizontal">
                <div class="field-body">
                    <div class="field">
                        <div class="control">
                            <input class="input" type="text" name="producer" placeholder="Producer (e.g. Canyon)" required>
                        </div>
                    </div>
                    <div class="field">
                        <div class="control">
                            <input class="input" type="text" name="name" placeholder="Name (e.g. Endurace)" required>
                        </div>
                    </div>
                    <div class="field">
                        <div class="control">
                            <button class="button is-primary" type="submit">Create</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <div class="box">
        <h2 class="title is-4">Inventory</h2>
        <table class="table is-striped is-hoverable is-fullwidth">
            <thead>
                <tr>
                    <th>Producer</th>
                    <th>Name</th>
                    <th class="has-text-centered">Total Distance</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {#for entry in bikes}
                <tr data-bike-id="{entry.bike.id}">
                    <td>
                        <input class="input is-small bike-producer" type="text" name="producer" value="{entry.bike.producer}" placeholder="Producer" required>
                    </td>
                    <td>
                        <input class="input is-small bike-name" type="text" name="name" value="{entry.bike.name}" placeholder="Name" required>
                    </td>
                    <td class="has-text-centered">{entry.totalDistance}</td>
                    <td>
                        <div class="buttons are-small">
                            <button class="button is-success is-outlined save-bike" data-id="{entry.bike.id}" title="Save">
                                <span class="icon">
                                    <i class="fas fa-save"></i>
                                </span>
                            </button>
                            <button class="button is-danger is-outlined delete-bike" data-id="{entry.bike.id}" title="Delete">
                                <span class="icon">
                                    <i class="fas fa-trash"></i>
                                </span>
                            </button>
                        </div>
                    </td>
                </tr>
                {/for}
            </tbody>
        </table>
    </div>

    <script src="/own/modal.js" defer></script>
{/include}
