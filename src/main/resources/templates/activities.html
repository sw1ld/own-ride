{#include base}
    <h1 class="title">Recent Activities</h1>
    <div id="activityFeed" class="activity-feed">
            {#include feeds data=data nextCursor=nextCursor /}
    </div>

    <style>
        .clickable-card:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fafafa;
        }
        .clickable-card.drag-over {
            border: 2px dashed #3273dc !important;
            background-color: #f0f6ff !important;
        }
        .rating.is-small {
            font-size: 0.75rem;
        }
        @media (prefers-color-scheme: dark) {
            .clickable-card:hover {
                background-color: #2c2c2c;
                box-shadow: 0 2px 8px rgba(255,255,255,0.05);
            }
            .clickable-card.drag-over {
                background-color: #1a2a4a !important;
            }
            .column.is-narrow div[style*="background-color: #f0f0f0"],
            .column.is-narrow div[style*="background-color: #e8f1ff"] {
                background-color: #333 !important;
                border-color: #444 !important;
            }
            .has-text-dark {
                color: #f5f5f5 !important;
            }
        }
    </style>

    <script>
        document.body.addEventListener('htmx:configRequest', function (event) {
            event.detail.headers['Accept'] = 'text/html';
        });
    </script>

    <script src="/own/rating.js" defer></script>
    <script src="/own/activities.js" defer></script>
{/include}
