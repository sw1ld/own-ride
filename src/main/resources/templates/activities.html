{#include base}
    <h1 class="title">Recent Activities</h1>
    <div id="activityFeed" class="activity-feed">
            {#include feeds data=data nextCursor=nextCursor /}
    </div>

    <style>
        .clickable-card:hover {
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fafafa;
        }
        .clickable-card.drag-over {
            border: 2px dashed #3273dc !important;
            background-color: #f0f6ff !important;
        }
        .rating.is-small {
            font-size: 0.75rem;
        }
        @media (prefers-color-scheme: dark) {
            .clickable-card:hover {
                background-color: #2c2c2c;
                box-shadow: 0 2px 8px rgba(255,255,255,0.05);
            }
            .clickable-card.drag-over {
                background-color: #1a2a4a !important;
            }
            .column.is-narrow div[style*="background-color: #f0f0f0"],
            .column.is-narrow div[style*="background-color: #e8f1ff"] {
                background-color: #333 !important;
                border-color: #444 !important;
            }
            .has-text-dark {
                color: #f5f5f5 !important;
            }
        }
        .activity-year-divider {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin: 2rem 0 2rem;
            color: var(--text-color);
            font-weight: 600;
        }

        .activity-year-divider::before,
        .activity-year-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
    </style>

    <script>
        document.body.addEventListener('htmx:configRequest', function (event) {
            event.detail.headers['Accept'] = 'text/html';
        });
        document.body.addEventListener('htmx:afterRequest', function (event) {
            if (event.detail.elt && event.detail.elt.hasAttribute('hx-get')) {
                event.detail.elt.removeAttribute('hx-get');
                event.detail.elt.removeAttribute('hx-trigger');
                event.detail.elt.removeAttribute('hx-swap');
                event.detail.elt.removeAttribute('hx-target');
            }
        });

        document.body.addEventListener("htmx:afterSwap", (event) => {
            const target = event.detail.target;

            if (!target.closest?.("#activity-feed") && target.id !== "feed-sentinel") {
                return;
            }
            addYearDividers();
        });

        function addYearDividers() {
            const feed = document.querySelector(".activity-feed");
            if (!feed) return;

            feed.querySelectorAll(".activity-year-divider").forEach(divider => {
                divider.remove();
            });

            const entries = feed.querySelectorAll(".clickable-card");
            let previousYear = null;

            entries.forEach((entry) => {
                // works for date but also date-range!
                const dateString = entry.dataset.date.split(" - ")[0];
                const date = new Date(dateString);
                const year = date.getFullYear();

                if (Number.isNaN(year)) return;

                if (previousYear !== null && year !== previousYear) {
                    const divider = document.createElement("div");
                    divider.className = "activity-year-divider";
                    divider.innerHTML = "<span>" + year + "</span>";

                    entry.before(divider);
                }

                previousYear = year;
            });
        }
    </script>

    <script src="/own/rating.js" defer></script>
    <script src="/own/activities.js" defer></script>
{/include}
